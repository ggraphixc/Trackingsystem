# Dravex Tag — recovery beacon (nRF52840)

# Bluetooth LE peripheral with extended advertising (the 43-byte packet with
# UUID128 + service data + name does not fit legacy advertising).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="Dravex-Tag"

# Persistent identity: a random 12-hex id survives reboots and battery swaps.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# Random id generation on first boot.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_RANDOM_GENERATOR=y

# Button + LED.
CONFIG_GPIO=y

# Logging (prints the tag id on boot).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
