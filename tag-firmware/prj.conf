# Dravex Tag V2 — recovery beacon (nRF52840)

# --- Bluetooth LE peripheral with extended advertising ----------------
# The 43-byte packet (UUID128 + service data) does not fit legacy adv.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="Dravex-Tag"
# Controller TX power is centralized here (0 dBm default on nRF52840).
# Tune for range vs battery: e.g. CONFIG_BT_CTLR_TX_PWR_MINUS_8DBM.

# --- Persistent identity: NVS secret survives reboots + battery swaps ---
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# --- Day-rotated beacon: sha256 derivation ----------------------------
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256=y

# --- Low power: STANDBY between bursts (RTC keeps running, ~1 uA) ------
CONFIG_PM=y
# ADC for battery sense on boards that wire the batt_vbat alias.
CONFIG_ADC=y

# --- Random secret generation on first boot ----------------------------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_RANDOM_GENERATOR=y

# --- Button + LED -------------------------------------------------------
CONFIG_GPIO=y

# --- Logging (prints the tag id on boot) -------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Test mode: OFF by default (production default). --------------------
# Enable only for bench work: CONFIG_DRAVEX_TAG_TEST_MODE=y in a .conf
# overlay (e.g. prj_test.conf) — never in a production build.
